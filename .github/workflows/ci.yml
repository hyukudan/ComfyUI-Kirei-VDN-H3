name: VDN-H3 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMFY_SHA: 0b5b009dd4496529b08efa9301f97e0a5fefa2f9
  OPENVDN_SHA: b8cb28fbfca0266d1c7742a9f25ab8b58191de97

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install pytest safetensors numpy
      - name: Compile Python sources
        run: python -m compileall -q vdn_h3 tests benchmarks
      - name: Run dependency-light suite
        run: |
          pytest -q \
            tests/test_adaln.py \
            tests/test_adapters.py \
            tests/test_autotune.py \
            tests/test_benchmark_nodes.py \
            tests/test_benchmark_protocol.py \
            tests/test_benchmark_record_result.py \
            tests/test_block_kernels.py \
            tests/test_branch.py \
            tests/test_bypass_mlp.py \
            tests/test_bypass_ownership.py \
            tests/test_checkpoint_recipe_report.py \
            tests/test_curve.py \
            tests/test_domestic_runtime.py \
            tests/test_hybrid.py \
            tests/test_layout.py \
            tests/test_optimized_runtime.py \
            tests/test_precision_runtime.py \
            tests/test_runtime_policy.py \
            tests/test_spec.py \
            tests/test_version.py \
            tests/test_window.py

  comfyui-pinned:
    name: Pinned ComfyUI and official OpenVDN oracles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ env.COMFY_SHA }}
          path: _deps/ComfyUI
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenVDN/vdn-minimax-h3
          ref: ${{ env.OPENVDN_SHA }}
          path: _deps/OpenVDN
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify source pins
        run: |
          test "$(git -C _deps/ComfyUI rev-parse HEAD)" = "$COMFY_SHA"
          test "$(git -C _deps/OpenVDN rev-parse HEAD)" = "$OPENVDN_SHA"
      - name: Install ComfyUI CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          sed '/^torch$/d;/^torchvision$/d;/^torchaudio$/d' _deps/ComfyUI/requirements.txt > "$RUNNER_TEMP/comfy-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/comfy-requirements.txt"
          python -m pip install pytest pytest-timeout PyYAML
      - name: Run complete CPU suite with pinned source oracles
        env:
          OPENVDN_ROOT: ${{ github.workspace }}/_deps/OpenVDN
          PYTHONPATH: ${{ github.workspace }}/_deps/ComfyUI:${{ github.workspace }}
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m compileall -q vdn_h3 tests benchmarks
          pytest -q tests --timeout=120

  comfyui-current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Clone current ComfyUI
        run: git clone --depth 1 https://github.com/Comfy-Org/ComfyUI.git "$RUNNER_TEMP/ComfyUI"
      - name: Install ComfyUI CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          sed '/^torch$/d;/^torchvision$/d;/^torchaudio$/d' "$RUNNER_TEMP/ComfyUI/requirements.txt" > "$RUNNER_TEMP/comfy-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/comfy-requirements.txt"
          python -m pip install pytest
      - name: Run complete suite against current ComfyUI
        env:
          PYTHONPATH: ${{ runner.temp }}/ComfyUI:${{ github.workspace }}
        run: pytest -q
